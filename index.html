<style>

<body>
<div class="app">
  <div class="sidebar" id="sidebar">
    <div class="logo"><span>Uzaki</span><small>AI ROLEPLAY CHAT</small></div>
    <div class="side-actions">
      <button class="btn btn-primary" data-act="new-char">＋ New Character</button>
      <button class="btn btn-ghost" data-act="new-group">👥 New Group Chat</button>
      <button class="btn btn-ghost" data-act="settings">⚙ Settings</button>
    </div>
    <div class="tabs">
      <div class="tab active" id="tabChars" data-act="tab-chars">Characters</div>
      <div class="tab" id="tabChats" data-act="tab-chats">Chats</div>
    </div>
    <div class="side-list" id="sideList"></div>
  </div>
  <div class="main" id="main"></div>
</div>
<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
const $=s=>document.querySelector(s);
const COLORS=['#7c5cff','#ff5c8a','#00c2a8','#ff9f43','#4dabf7','#e64980','#20c997','#fab005','#845ef7','#ff6b6b'];
const EMOJIS=['🦊','🐺','🐱','🦁','🐉','🧛','🧙','👻','👽','🤖','🦸','🧚','🧜','🦄','🌙','⭐','⚡','🔥','🌊','🌸','🗡️','👑','💀','🎭','🎀','🧿'];
let pickedEmoji='🙂',pendingAvatar=null;
let DB=Object.assign({characters:[],chats:[],settings:{}},JSON.parse(localStorage.getItem('uzaki_data')||'null')||{});
DB.settings=Object.assign({provider:'horde',userName:'You',hordeKey:'0000000000',hordeModel:'auto',hordeNsfw:true,geminiKey:'',geminiModel:'gemini-2.0-flash',openaiKey:''},DB.settings);
let state={tab:'chars',view:{t:'chars'}};

const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const escRe=s=>String(s).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const getChar=id=>DB.characters.find(c=>c.id===id);
const getChat=id=>DB.chats.find(c=>c.id===id);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const save=()=>localStorage.setItem('uzaki_data',JSON.stringify(DB));
function colorFor(n){let h=0;for(const c of(n||''))h=(h*31+c.charCodeAt(0))>>>0;return COLORS[h%COLORS.length]}
function memberNames(chat){return chat.members.map(getChar).filter(Boolean).map(c=>c.name).join(', ')}
function avatarHTML(c,cls){if(c.avatar)return '<div class="avatar '+cls+'"><img src="'+c.avatar+'" class="avimg" alt=""></div>';
 return '<div class="avatar '+cls+'" style="background:'+colorFor(c.name)+'">'+(c.emoji||'🙂')+'</div>'}
let toastTimer;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),3500)}
function modal(h){$('#overlay').classList.add('show');$('#modal').innerHTML=h}
function closeModal(){$('#overlay').classList.remove('show')}

/* ---------- VIEWS ---------- */
function render(){renderSidebar();
 if(state.view.t==='chars')renderCharsView();else if(state.view.t==='chat')renderChatView(state.view.id)}

function renderSidebar(){
 $('#tabChars').classList.toggle('active',state.tab==='chars');
 $('#tabChats').classList.toggle('active',state.tab==='chats');
 const l=$('#sideList');
 if(state.tab==='chars'){
  l.innerHTML=DB.characters.length?DB.characters.map(c=>`
   <div class="srow" data-act="quick-chat" data-id="${c.id}">
    ${avatarHTML(c,'')}<div><div class="sname">${esc(c.name)}</div><div class="ssub">${esc(c.tagline||'')}</div></div></div>`).join('')
  :`<div class="side-empty">No characters yet.<br>Create one to begin.</div>`;
 }else{
  l.innerHTML=DB.chats.length?DB.chats.map(c=>{
   const last=c.messages[c.messages.length-1];
   const a=c.type==='group'?'<div class="avatar" style="background:#2a2f40">👥</div>':avatarHTML(getChar(c.members[0])||{name:c.name,emoji:'💬'},'');
   return `<div class="srow" data-act="open-chat" data-id="${c.id}">${a}
    <div><div class="sname">${esc(c.name)}</div><div class="ssub">${last?esc(last.text.slice(0,42)):'New chat'}</div></div></div>`}).join('')
  :`<div class="side-empty">No chats yet.<br>Pick a character or make a group.</div>`;}}

function renderCharsView(){
 const cs=DB.characters;
 $('#main').innerHTML=`
  <div class="page-head">
   <button class="icon-btn menu-btn" data-act="menu">☰</button>
   <h2>Characters <span class="count">${cs.length}</span></h2>
   <button class="btn btn-primary sm" data-act="new-char">＋ New Character</button></div>
  ${cs.length?`<div class="grid">${cs.map(c=>`
   <div class="card">
    ${avatarHTML(c,'big')}
    <div class="cname">${esc(c.name)}</div>
    <div class="ctag">${esc(c.tagline||'Roleplay character')}</div>
    <div class="crow">
     <button class="btn btn-primary sm" data-act="quick-chat" data-id="${c.id}">Chat</button>
     <button class="icon-btn" data-act="edit-char" data-id="${c.id}">✏️</button>
     <button class="icon-btn" data-act="del-char" data-id="${c.id}">🗑</button></div></div>`).join('')}</div>`
 :`<div class="empty"><div class="empty-emoji">✨</div><h3>No characters yet</h3>
    <p>This is your world — you decide who lives in it.<br>Create your first character to start.</p>
    <button class="btn btn-primary" data-act="new-char">＋ Create your first character</button></div>`}`}

function renderChatView(id){
 const chat=getChat(id);
 if(!chat){state.view={t:'chars'};return renderCharsView()}
 $('#main').innerHTML=`
  <div class="chat-head">
   <button class="icon-btn menu-btn" data-act="menu">☰</button>
   <div class="ch-title"><b>${esc(chat.name)}</b><small>${chat.type==='group'?esc(memberNames(chat)||'group'):'1-on-1 chat'}</small></div>
   <button class="icon-btn" data-act="regen" title="Regenerate last reply">↻</button>
   <button class="icon-btn" data-act="del-chat" data-id="${chat.id}">🗑</button>
   <button class="icon-btn" data-act="back">←</button></div>
  <div class="messages" id="messages"></div>
  <div class="inputbar">
   <textarea id="msgInput" rows="1" placeholder="Type a message..."></textarea>
   <button class="btn btn-primary send" data-act="send">➤</button></div>`;
 renderMessages(chat);
 const inp=$('#msgInput');inp.focus();
 inp.addEventListener('input',()=>{inp.style.height='auto';inp.style.height=Math.min(inp.scrollHeight,120)+'px'})}

function renderMessages(chat){
 const box=$('#messages');if(!box)return;
 box.innerHTML=chat.messages.map((m,i)=>{
  if(m.role==='user')return `<div class="row user"><button class="delx" data-act="del-msg" data-i="${i}">✕</button><div class="bubble">${esc(m.text)}</div></div>`;
  const ch=m.charId?getChar(m.charId):null;
  const av=(ch&&(ch.avatar||ch.emoji))?avatarHTML(ch,''):'<div class="avatar" style="background:'+colorFor(m.name)+'">'+(m.emoji||'🙂')+'</div>';
  return `<div class="row">${av}<div class="bubble"><div class="who">${esc(m.name)}</div>${esc(m.text)}</div>
   <button class="delx" data-act="del-msg" data-i="${i}">✕</button></div>`}).join('');
 box.scrollTop=box.scrollHeight}

/* ---------- CHAT LOGIC ---------- */
function openSingleChat(cid){
 const ch=getChar(cid);if(!ch)return;
 let chat=DB.chats.find(c=>c.type==='single'&&c.members[0]===cid);
 if(!chat){
  chat={id:uid(),type:'single',name:ch.name,members:[cid],messages:[]};
  if(ch.greeting)chat.messages.push({role:'char',charId:cid,name:ch.name,emoji:ch.emoji,text:ch.greeting,time:Date.now()});
  DB.chats.unshift(chat);save()}
 $('#sidebar').classList.remove('open');
 state.view={t:'chat',id:chat.id};render()}

function send(){
 const inp=$('#msgInput');if(!inp)return;
 const text=inp.value.trim();if(!text)return;
 const chat=getChat(state.view.id);if(!chat)return;
 chat.messages.push({role:'user',text,time:Date.now()});
 save();inp.value='';inp.style.height='auto';
 renderMessages(chat);
 respondSequence(chat,pickResponders(chat,text),0,text)}

function pickResponders(chat,text){
 if(chat.type==='single')return[chat.members[0]];
 const lower=' '+text.toLowerCase()+' ';
 const mentioned=chat.members.filter(id=>{const c=getChar(id);return c&&lower.includes(c.name.toLowerCase())});
 if(mentioned.length)return mentioned.slice(0,2);
 const last=chat.messages[chat.messages.length-1];
 if(last&&last.role==='char'&&last.charId&&Math.random()<.5)return[last.charId];
 const pool=[...chat.members].sort(()=>Math.random()-.5);
 return pool.slice(0,Math.random()<.65?1:2)}

async function respondSequence(chat,ids,i,userText){
 if(i>=ids.length)return;
 const ch=getChar(ids[i]);
 if(!ch)return respondSequence(chat,ids,i+1,userText);
 showTyping(ch);
 let reply;
 try{reply=await aiReply(chat,ch,userText)}
 catch(err){reply=demoReply(ch,userText);
  toast('AI unavailable ('+err.message+') — offline reply shown. Try again or check Settings.')}
 hideTyping();
 if(reply&&reply.trim()){
  chat.messages.push({role:'char',charId:ch.id,name:ch.name,emoji:ch.emoji,text:reply.trim(),time:Date.now()});
  save()}
 if(state.view.t==='chat'&&state.view.id===chat.id)renderMessages(chat);
 respondSequence(chat,ids,i+1,userText)}

function showTyping(ch){
 const box=$('#messages');if(!box)return;
 hideTyping();
 const d=document.createElement('div');d.className='row';d.id='typing';
 const status=DB.settings.provider==='horde'?'free AI queue — 30s to 2 min…':'thinking…';
 d.innerHTML=avatarHTML(ch,'')+'<div class="bubble"><div class="who">'+esc(ch.name)+'</div><span class="dots"><i></i><i></i><i></i></span><div class="subtxt">'+status+'</div></div>';
 box.appendChild(d);box.scrollTop=box.scrollHeight}
function hideTyping(){const t=$('#typing');if(t)t.remove()}

/* ---------- REPLIES ---------- */
function demoReply(ch,userText){
 const t=(userText||'').trim();
 if(!t)return "Well? Don't go quiet on me now.";
 const topic=t.length>50?t.slice(0,47)+'…':t;
 const T=[`${topic}? Now that's interesting — tell me more.`,
  `Hmm, ${topic}... let me think about that.`,
  `Okay but what's the story behind ${topic}? Details.`,
  `I like where your head's at. So — ${topic}, huh?`,
  `Alright, I'm listening. Say more about ${topic}.`];
 return T[Math.floor(Math.random()*T.length)]}

function systemPrompt(chat,ch){
 const u=DB.settings.userName||'You';
 const L=[`You are ${ch.name}, a character in an immersive roleplay chat with a human user named "${u}".`];
 if(ch.personality)L.push(`${ch.name}'s personality: ${ch.personality}`);
 if(ch.tagline)L.push(`About ${ch.name}: ${ch.tagline}`);
 if(chat.type==='group'){
  const others=chat.members.filter(x=>x!==ch.id).map(x=>getChar(x)).filter(Boolean).map(c=>c.name);
  L.push(`This is a group chat. Other characters present: ${others.join(', ')}. Only write ${ch.name}'s words and actions — never write for ${u} or the others.`)}
 else L.push(`Chat one-on-one with ${u}. Never write ${u}'s lines or thoughts.`);
 L.push('Stay fully in character. Keep replies 1-4 sentences. Use *asterisks* for actions and feelings. Keep continuity with the conversation. Never mention being an AI.');
 return L.join('\n')}

async function aiReply(chat,ch,userText){
 const s=DB.settings;
 if(s.provider==='horde')return hordeReply(chat,ch);
 if(s.provider==='gemini')return geminiReply(chat,ch);
 if(s.provider==='openai')return openaiReply(chat,ch);
 await sleep(600+Math.random()*900);
 return demoReply(ch,userText)}

/* --- AI Horde: free + uncensored --- */
async function hordeReply(chat,ch){
 const s=DB.settings,u=s.userName||'You';
 let p='';
 if(chat.type==='group'){
  for(const id of chat.members){const c=getChar(id);if(c)p+=(c.name)+"'s personality: "+(c.personality||'a friendly roleplay character')+'\n'}
 }else{
  p+=ch.name+"'s personality: "+(ch.personality||'a friendly roleplay character')+'\n';
  if(ch.tagline)p+='Scenario: '+ch.tagline+'\n'}
 p+='\n<START>\n';
 for(const m of chat.messages.slice(-20)){
  p+=(m.role==='user'?u:m.name)+': '+m.text+'\n'}
 p+=ch.name+':';
 const body={prompt:p,
  params:{max_length:200,max_context_length:1024,temperature:.85,top_p:.92,rep_pen:1.1,rep_pen_range:512,
   stop_sequence:['\n'+u+':','\n<START>']},
  nsfw:!!s.hordeNsfw,shared:false};
 if(s.hordeModel&&s.hordeModel!=='auto')body.models=[s.hordeModel];
 const r=await fetch('https://aihorde.net/api/v2/generate/text/async',{method:'POST',
  headers:{'Content-Type':'application/json','apikey':s.hordeKey||'0000000000'},
  body:JSON.stringify(body)});
 if(!r.ok){const e=await r.json().catch(()=>({message:'HTTP '+r.status}));throw new Error(e.message||'Horde '+r.status)}
 const {id}=await r.json();
 const t0=Date.now();
 while(Date.now()-t0<150000){
  await sleep(3000);
  const st=await fetch('https://aihorde.net/api/v2/generate/text/status/'+id);
  if(!st.ok)throw new Error('Horde '+st.status);
  const d=await st.json();
  if(d.is_possible===false)throw new Error('no workers online');
  if(d.faulted)throw new Error('worker faulted');
  if(d.done&&d.generations&&d.generations[0]){
   let t=(d.generations[0].text||'').replace(/\r/g,'').trim();
   t=t.replace(new RegExp('^'+escRe(ch.name)+'\\s*:\\s*','i'),'');
   const names=[u,...chat.members.map(x=>getChar(x)).filter(Boolean).map(c=>c.name)];
   const cut=new RegExp('\\n\\s*('+names.map(escRe).join('|')+')\\s*:','i').exec(t);
   if(cut)t=t.slice(0,cut.index);
   t=t.replace(/\n{3,}/g,'\n\n').trim();
   if(!t)throw new Error('empty reply');
   return t}}
 throw new Error('queue timeout')}

/* --- Gemini: free, smart, safe-filtered --- */
async function geminiReply(chat,ch){
 const s=DB.settings,u=s.userName||'You';
 const sys=systemPrompt(chat,ch);
 const contents=chat.messages.slice(-20).map(m=>({role:m.role==='user'?'user':'model',
  parts:[{text:(chat.type==='group'&&m.role!=='user'?m.name+': ':'')+m.text}]}));
 const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${s.geminiModel||'gemini-2.0-flash'}:generateContent?key=${encodeURIComponent(s.geminiKey)}`,
  {method:'POST',headers:{'Content-Type':'application/json'},
   body:JSON.stringify({systemInstruction:{parts:[{text:sys}]},contents})});
 if(!r.ok){const e=await r.json().catch(()=>null);throw new Error(e?.error?.message||'Gemini '+r.status)}
 const d=await r.json();
 const t=d.candidates?.[0]?.content?.parts?.map(p=>p.text||'').join('')||'';
 if(!t)throw new Error('empty reply');
 return t.trim()}

/* --- OpenAI (optional) --- */
async function openaiReply(chat,ch){
 const s=DB.settings,u=s.userName||'You';
 const sys=systemPrompt(chat,ch);
 const msgs=[{role:'system',content:sys},...chat.messages.slice(-20).map(m=>({role:m.role==='user'?'user':'assistant',
  content:(chat.type==='group'&&m.role!=='user'?m.name+': ':'')+m.text}))];
 const r=await fetch('https://api.openai.com/v1/chat/completions',{method:'POST',
  headers:{'Content-Type':'application/json','Authorization':'Bearer '+s.openaiKey},
  body:JSON.stringify({model:'gpt-4o-mini',messages:msgs})});
 if(!r.ok)throw new Error('OpenAI '+r.status);
 const d=await r.json();return d.choices[0].message.content.trim()}
